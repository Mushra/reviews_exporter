[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacritic-export"
version = "1.1.0"
description = "Export Metacritic reviews into structured JSON files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7.0",
  "requests>=2.31,<3.0",
  "langdetect>=1.0.9,<2.0",
  "trafilatura>=1.8,<2.0",
  "youtube-transcript-api>=1.2,<2.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
metacritic-export = "main:main"

[tool.setuptools]
packages = ["core", "extractors", "models", "parsers", "pipeline", "services", "ui", "ui.tabs"]
